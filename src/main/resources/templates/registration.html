<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .registration-container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-bottom: 20px;
        }
        .form-group label {
            font-weight: bold;
        }
        .btn-primary {
            width: 100%;
        }
        .error-message {
            color: red;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="registration-container mt-5">
        <h2>Регистрация нового пользователя</h2>
        <form th:action="@{/registration}" method="post" th:object="${registrationUserDto}" onsubmit="return validatePasswords()">
            <div class="form-group">
                <label for="username">Имя пользователя:</label>
                <input type="text" id="username" class="form-control" th:field="*{username}" required />
            </div>
            <div class="form-group">
                <label for="email">Электронная почта:</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" required />
            </div>
            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" class="form-control" th:field="*{password}" required />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Подтверждение пароля:</label>
                <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}" required />
                <div id="passwordError" class="error-message"></div>
            </div>
            <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    function validatePasswords() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('passwordError');

        // Удалить предыдущее сообщение об ошибке
        errorDiv.textContent = '';

        if (password !== confirmPassword) {
            errorDiv.textContent = 'Пароли не совпадают!';
            return false; // Предотвращаем отправку формы
        }
        return true; // Позволяем отправить форму
    }
</script>
</body>
</html>
